name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify tag and application versions
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $cargo = cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | ConvertFrom-Json
          $cargoVersion = ($cargo.packages | Where-Object name -eq "background-studio").version
          if ($tag -ne "v$cargoVersion") {
            throw "标签 $tag 与 Cargo.toml 版本 v$cargoVersion 不一致。"
          }

      - name: Run checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build NSIS installer
        working-directory: src-tauri
        run: cargo packager --release

      - name: Build and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $asset = Get-ChildItem dist -Filter "*setup.exe" | Select-Object -First 1
          if (-not $asset) {
            throw "cargo-packager 没有生成 NSIS 安装包。"
          }
          $releaseAsset = Join-Path $asset.DirectoryName "Background.Studio_${version}_x64-setup.exe"
          Move-Item $asset.FullName $releaseAsset -Force
          $releaseArgs = @(
            "release", "create", $tag, $releaseAsset,
            "--title", "Background Studio $tag",
            "--generate-notes"
          )
          if ($tag.Contains("-")) {
            $releaseArgs += "--prerelease"
          }
          gh @releaseArgs

      - name: Notify scoop-bucket to sync manifest
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN || github.token }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          gh api repos/background-studio/scoop-bucket/dispatches `
            -f event_type=host-release `
            -f "client_payload[version]=$version"
